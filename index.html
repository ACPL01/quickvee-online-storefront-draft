<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quickvee Setup Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HOME VIEW -->
  <div id="home-view" class="view active">
    <header class="home-header">
      <div class="header-inner">
        <div class="logo-lockup">
          <img src="Images/Set Up Your Products/Quickvee logo - v1_Quickvee Logo (6).png" alt="Quickvee" class="logo-img" />
        </div>
        <h1 class="home-title">Online Storefront Guide</h1>
      </div>

      <div class="progress-bar-wrapper" aria-label="Overall progress">
        <div class="progress-label">
          <span id="progress-text">0 of 4 completed</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <p class="progress-hint" id="progress-hint">Complete the first 3 sections to unlock Launch.</p>
      </div>
    </header>

    <main class="cards-grid" id="cards-grid" aria-label="Setup sections">
      <!-- Cards injected by JS -->
    </main>

    <footer class="home-footer">
      <button class="reset-link" id="reset-btn" aria-label="Reset all progress">Reset progress</button>
    </footer>
  </div>

  <!-- SECTION VIEW -->
  <div id="section-view" class="view">
    <header class="section-header">
      <button class="back-btn" id="back-btn" aria-label="Back to home">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Home
      </button>
      <h2 class="section-title-heading" id="section-title-heading"></h2>
      <div class="section-meta" style="display:none;">
        <span class="section-badge" id="section-badge"></span>
        <span class="step-counter" id="step-counter"></span>
      </div>
    </header>

    <div class="step-progress-track">
      <div class="step-progress-fill" id="step-progress-fill"></div>
    </div>

    <div class="guide-body">

      <!-- TABLE OF CONTENTS SIDEBAR -->
      <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of contents">
        <div class="toc-header">
          <span class="toc-heading">Contents</span>
          <button class="toc-toggle-btn" id="toc-toggle" aria-label="Collapse contents">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
        </div>
        <nav class="toc-nav" id="toc-nav" aria-label="Guide sections"></nav>
      </aside>

      <!-- MAIN STEP CONTENT -->
      <main class="step-content" id="step-content" role="main">
        <!-- Step content injected by JS -->
      </main>

    </div>

    <nav class="step-nav" aria-label="Step navigation">
      <button class="btn btn-ghost" id="prev-btn" aria-label="Previous step">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Previous
      </button>
      <button class="btn btn-primary" id="next-btn" aria-label="Next step">
        Next
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn btn-complete hidden" id="complete-btn" aria-label="Mark section as complete">
        ✓ Mark as Complete
      </button>
    </nav>
  </div>

  <!-- COMPLETION TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- FLOATING SUPPORT BUTTONS -->
  <button class="fab fab-phone" id="fab-phone" aria-label="Call support" onclick="if(confirm('Do you want to call Quickvee Support?')) window.location.href='tel:18003901940'">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.47 11.47 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z" fill="currentColor"/>
    </svg>
  </button>
  <button class="fab fab-help" id="fab-help" aria-label="Help" onclick="window.open('https://help.quickvee.com/hc/en-us','_blank')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2a8 8 0 100-16 8 8 0 000 16zm-1-5h2v2h-2v-2zm2-1.645V14h-2v-1.5a1 1 0 011-1 1.5 1.5 0 10-1.5-1.5H9a3.5 3.5 0 113 3.355z" fill="currentColor"/>
    </svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
